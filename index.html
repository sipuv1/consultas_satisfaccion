
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ETICOS | Encuesta</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
    font-family:Arial;
    background:#f4f7ff;
    padding:30px;
}

.card{
    background:white;
    max-width:700px;
    margin:auto;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
    color:#0d47a1;
    text-align:center;
}

.question{
    margin-top:30px;
}

.option{

    background:#eef3ff;

    padding:18px;

    border-radius:14px;

    margin-top:12px;

    display:flex;

    align-items:center;

    gap:12px;

    cursor:pointer;

    transition:.2s;

    border:2px solid transparent;
}

.option:hover{

    background:#dfe9ff;
}

.option input{

    transform:scale(1.2);
}

.option:has(input:checked){

    border:2px solid #0d47a1;

    background:#dbe7ff;
}

.option span{
    font-size:18px;
    font-weight:500;
}

button{
    width:100%;
    padding:18px;
    background:#0d47a1;
    color:white;
    border:none;
    border-radius:12px;
    margin-top:30px;
    cursor:pointer;
    font-size:18px;
}

textarea{
    width:100%;
    padding:15px;
    border-radius:10px;
}

.logo{
    width:260px;
    height:100px;
    border:2px dashed #0d47a1;
    border-radius:20px;
    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:0 auto;

    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:10px;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img
    id="logoEmpresa"
    src="img/logo.png"
    alt="Logo ETICOS"
/>

</div>

<h1>¿Cómo fue tu experiencia?</h1>

<p>Tu opinión nos ayuda a mejorar nuestro servicio ¡queremos que tengas una bonita experiencia! </p>

<form id="encuestaForm">

<div class="question">

<h3>¿Cómo calificas la atención recibida?</h3>

<label class="option">
<input
    type="radio"
    name="calificacion"
    value="1"
    required
>
<span>
⭐ Muy mala
</span>
</label>

<label class="option">
<input
    type="radio"
    name="calificacion"
    value="2"
    required
>
<span>
⭐⭐ Mala
</span>
</label>

<label class="option">
<input
    type="radio"
    name="calificacion"
    value="3"
    required
>
<span>
⭐⭐⭐ Regular
</span>
</label>

<label class="option">
<input
    type="radio"
    name="calificacion"
    value="4"
    required
>
<span>
⭐⭐⭐⭐ Buena
</span>
</label>

<label class="option">
<input
    type="radio"
    name="calificacion"
    value="5"
    required
>
<span>
⭐⭐⭐⭐⭐ Excelente
</span>
</label>


</div>

<div class="question">

<h3>¿El tiempo de atención fue adecuado?</h3>

<label class="option">
<input
    type="radio"
    name="tiempo"
    value="Si"
    required
>
<span>
Sí
</span>
</label>

<label class="option">
<input
    type="radio"
    name="tiempo"
    value="No"
    required
>
<span>
No
</span>
</label>


</div>

<div class="question">

<h3>¿El personal fue amable y claro?</h3>

<label class="option">
<input
    type="radio"
    name="amabilidad"
    value="Si"
    required
>
<span>
Sí
</span>
</label>

<label class="option">
<input
    type="radio"
    name="amabilidad"
    value="Parcialmente"
    required
>
<span>
Parcialmente
</span>
</label>

<label class="option">
<input
    type="radio"
    name="amabilidad"
    value="No"
    required
>
<span>
No
</span>
</label>


</div>

<div class="question">

<h3>¿Recomendarías nuestro servicio?</h3>

<label class="option">
<input
    type="radio"
    name="recomendaria"
    value="true"
    required
>
<span>
Sí
</span>
</label>

<label class="option">
<input
    type="radio"
    name="recomendaria"
    value="false"
    required
>
<span>
No
</span>
</label>


</div>

<div class="question">

<h3>Déjanos un comentario</h3>

<textarea id="comentario" rows="5"></textarea>

</div>

<button type="submit">
Enviar Encuesta
</button>

</form>

</div>

<script>

const SUPABASE_URL = 'https://ouclpvprplwodgfrywqn.supabase.co'
const SUPABASE_KEY = 'sb_publishable_mBpE0snPflgJXkaw0j9oCA_iw7x7QWI'

const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
)

document
.getElementById('encuestaForm')
.addEventListener('submit', async function(e){

e.preventDefault()

const calificacion =
document.querySelector('input[name="calificacion"]:checked').value

const tiempo =
document.querySelector('input[name="tiempo"]:checked').value

const amabilidad =
document.querySelector('input[name="amabilidad"]:checked').value

const recomendaria =
document.querySelector('input[name="recomendaria"]:checked').value

const comentario =
document.getElementById('comentario').value

const { data, error } = await client
.from('respuestas')
.insert([
{
    calificacion: calificacion,
    tiempo_atencion: tiempo,
    amabilidad: amabilidad,
    recomendaria: recomendaria === 'true',
    comentario: comentario
}
])

if(error){

    alert('Error guardando información')

    console.log(error)

}else{

    alert('¡Gracias por tu opinión!')

    document.getElementById('encuestaForm').reset()
}

})

</script>

</body>
</html>
